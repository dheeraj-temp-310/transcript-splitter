<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Transcript Splitter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            /* Aesthetic Color Palette */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #eef2f3 100%);
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --primary-gradient: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            --primary-hover: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            --success: #10b981;
            --card-bg: rgba(255, 255, 255, 0.85);
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            line-height: 1.6;
            padding: 3rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            resize: vertical;
            font-size: 1rem;
            color: var(--text-main);
            background-color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        textarea:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .input-group label {
            font-weight: 500;
            color: var(--text-main);
        }

        input[type="number"] {
            width: 80px;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #a78bfa;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .part-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Stagger animation for multiple cards */
        .part-card:nth-child(1) { animation-delay: 0.1s; }
        .part-card:nth-child(2) { animation-delay: 0.2s; }
        .part-card:nth-child(3) { animation-delay: 0.3s; }
        .part-card:nth-child(4) { animation-delay: 0.4s; }
        .part-card:nth-child(5) { animation-delay: 0.5s; }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .part-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .part-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .char-count {
            background: var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .part-content {
            width: 100%;
            height: 180px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: #ffffff;
            border: 2px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            resize: vertical;
        }

        .copy-btn {
            background: transparent;
            color: #8b5cf6;
            border: 2px solid #8b5cf6;
            padding: 0.5rem 1.25rem;
            font-size: 0.9rem;
            border-radius: 8px;
            box-shadow: none;
        }

        .copy-btn:hover {
            background: rgba(139, 92, 246, 0.1);
            transform: none;
            box-shadow: none;
        }

        .copy-btn.copied {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        @media (min-width: 600px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Transcript Splitter</h1>
            <p class="subtitle">Beautifully divide your long texts into manageable pieces.</p>
        </header>

        <div class="main-card">
            <textarea id="main-transcript" placeholder="Paste your long transcript here..."></textarea>
            
            <div class="controls">
                <div class="input-group">
                    <label for="num-parts">Divide into:</label>
                    <input type="number" id="num-parts" min="2" max="50" value="3">
                    <span style="color: var(--text-muted); font-size: 0.9rem;">parts</span>
                </div>
                <button onclick="splitTranscript()">Split Text ✨</button>
            </div>
        </div>

        <div class="output-section" id="output-container">
            <!-- Parts will be injected here by JS -->
        </div>
    </div>

    <script>
        function splitTranscript() {
            const text = document.getElementById('main-transcript').value.trim();
            const outputContainer = document.getElementById('output-container');
            let numParts = parseInt(document.getElementById('num-parts').value);
            
            if (!text) {
                alert("Please paste a transcript first.");
                return;
            }

            if (isNaN(numParts) || numParts < 1) {
                numParts = 3; // Fallback to 3 if user enters something invalid
                document.getElementById('num-parts').value = 3;
            }

            const totalLength = text.length;
            const targetLength = Math.ceil(totalLength / numParts);
            let parts = [];
            let currentIndex = 0;

            for (let i = 0; i < numParts; i++) {
                if (i === numParts - 1) {
                    // The last part gets whatever is remaining
                    parts.push(text.substring(currentIndex).trim());
                } else {
                    let end = currentIndex + targetLength;
                    
                    // Try to break at a space to avoid cutting words in half
                    if (end < totalLength) {
                        let nextSpace = text.indexOf(' ', end);
                        let prevSpace = text.lastIndexOf(' ', end);

                        // Pick the space closest to our target end point
                        if (nextSpace !== -1 && prevSpace !== -1) {
                            end = (nextSpace - end) < (end - prevSpace) ? nextSpace : prevSpace;
                        } else if (nextSpace !== -1) {
                            end = nextSpace;
                        } else if (prevSpace !== -1 && prevSpace > currentIndex) {
                            end = prevSpace;
                        }
                    }
                    
                    parts.push(text.substring(currentIndex, end).trim());
                    currentIndex = end;
                }
            }

            // Filter out any empty parts just in case the division caused trailing empty strings
            parts = parts.filter(part => part.length > 0);
            renderParts(parts);
        }

        function renderParts(parts) {
            const container = document.getElementById('output-container');
            container.innerHTML = ''; // Clear previous outputs

            parts.forEach((partText, index) => {
                const partNumber = index + 1;
                
                const card = document.createElement('div');
                card.className = 'part-card';
                // Reset animation if there are many cards so they don't delay too long
                if (index >= 5) {
                    card.style.animationDelay = '0.5s'; 
                }
                
                card.innerHTML = `
                    <div class="part-header">
                        <span class="part-title">
                            Part ${partNumber} 
                            <span class="char-count">${partText.length} chars</span>
                        </span>
                        <button class="copy-btn" onclick="copyText(this, 'part-${partNumber}')">Copy</button>
                    </div>
                    <textarea id="part-${partNumber}" class="part-content" readonly>${partText}</textarea>
                `;
                
                container.appendChild(card);
            });

            container.style.display = 'flex';
            
            // Smooth scroll down to the first result
            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function copyText(button, elementId) {
            const textArea = document.getElementById(elementId);
            
            navigator.clipboard.writeText(textArea.value).then(() => {
                // Visual feedback for success
                button.innerText = 'Copied!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerText = 'Copy';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy text. Please try selecting and copying manually.');
            });
        }
    </script>
</body>
</html>
